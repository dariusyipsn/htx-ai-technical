[project]
name = "htx-ai-technical"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Darius Yip", email = "darius.yip@simplifynext.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.150.0",
    "langchain>=1.4.9",
    "langchain-core>=1.7.7",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "mcp>=1.30.0",
    "pydantic>=2.14.3",
    "python-dateutil>=4.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
htx-ai-technical = "htx_ai_technical:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # lets tests import the root-level evals/ folder
